    function toggleHistoryExpand(historyId) {
      state.expandedHistory[historyId] = !state.expandedHistory[historyId];
      saveState();
      renderProgressTab();
    }

    function deleteWorkoutHistory(historyId) {
      const target = state.history.find((h) => h.id === historyId);
      openConfirmModal({
        title: 'Delete Workout Entry?',
        message: `Are you sure you want to delete ${target ? target.dayTitle : 'this workout'}?`,
        confirmLabel: 'Delete Workout',
        onConfirm: () => {
          state.history = state.history.filter((h) => h.id !== historyId);
          delete state.expandedHistory[historyId];
          saveState();
          renderProgressTab();
          triggerToast('Workout entry removed');
        }
      });
    }

    function changeCalendarMonth(delta) {
      const base = state.calendarMonth && /^\d{4}-\d{2}$/.test(state.calendarMonth)
        ? state.calendarMonth
        : getLocalIsoDate().slice(0, 7);
      const [y, m] = base.split('-').map(Number);
      const next = new Date(y, m - 1 + delta, 1);
      state.calendarMonth = `${next.getFullYear()}-${String(next.getMonth() + 1).padStart(2, '0')}`;
      saveState();
      renderProgressTab();
    }

    function selectCalendarDate(isoDate) {
      if (state.selectedCalendarDate === isoDate) {
        state.selectedCalendarDate = null;
      } else {
        state.selectedCalendarDate = isoDate;
      }
      saveState();
      renderProgressTab();
    }

    function clearCalendarSelection() {
      state.selectedCalendarDate = null;
      saveState();
      renderProgressTab();
    }

    function openLogPastSessionModal(prefillDate) {
      const defaultDate = prefillDate || state.selectedCalendarDate || getYesterdayIsoDate();
      state.missedSessionDraft = {
        mode: 'lifting',
        date: defaultDate,
        templateId: 'custom',
        duration: '45:00',
        notes: '',
        exercises: [
          { name: '', sets: 3, weight: 50, reps: 10 }
        ],
        cardioType: 'Running',
        cardioEnv: 'Outside',
        cardioDuration: '25:00',
        cardioDistance: '',
        saunaTemp: '',
        cardioNotes: ''
      };
      renderMissedSessionModal();
    }

    function syncMissedDraftFromInputs() {
      const d = state.missedSessionDraft;
      if (!d) return;
      const dateEl = document.getElementById('missedSessionDate');
      if (dateEl && dateEl.value) d.date = dateEl.value;

      if (d.mode === 'lifting') {
        const durEl = document.getElementById('missedLiftDuration');
        const notesEl = document.getElementById('missedLiftNotes');
        if (durEl) d.duration = durEl.value;
        if (notesEl) d.notes = notesEl.value;
        d.exercises.forEach((ex, idx) => {
          const nEl = document.getElementById(`missed_ex_name_${idx}`);
          const sEl = document.getElementById(`missed_ex_sets_${idx}`);
          const wEl = document.getElementById(`missed_ex_weight_${idx}`);
          const rEl = document.getElementById(`missed_ex_reps_${idx}`);
          if (nEl) ex.name = nEl.value;
          if (sEl) ex.sets = Math.max(1, parseInt(sEl.value, 10) || 1);
          if (wEl) ex.weight = Math.max(0, parseFloat(wEl.value) || 0);
          if (rEl) ex.reps = Math.max(1, parseInt(rEl.value, 10) || 1);
        });
      } else {
        const typeEl = document.getElementById('missedCardioType');
        const envEl = document.getElementById('missedCardioEnv');
        const durEl = document.getElementById('missedCardioDuration');
        const distEl = document.getElementById('missedCardioDistance');
        const tempEl = document.getElementById('missedSaunaTemp');
        const notesEl = document.getElementById('missedCardioNotes');
        if (typeEl) d.cardioType = typeEl.value;
        if (envEl) d.cardioEnv = envEl.value;
        if (durEl) d.cardioDuration = durEl.value;
        if (distEl) d.cardioDistance = distEl.value;
        if (tempEl) d.saunaTemp = tempEl.value;
        if (notesEl) d.cardioNotes = notesEl.value;
      }
    }

    function setMissedSessionMode(mode) {
      syncMissedDraftFromInputs();
      if (state.missedSessionDraft) {
        state.missedSessionDraft.mode = mode;
        renderMissedSessionModal();
      }
    }

    function handleMissedTemplateSelect(templateId) {
      syncMissedDraftFromInputs();
      const d = state.missedSessionDraft;
      if (!d) return;
      d.templateId = templateId;
      if (templateId === 'custom') {
        d.exercises = [{ name: '', sets: 3, weight: 50, reps: 10 }];
      } else {
        const tpl = getAllAvailableDayTemplates().find((t) => t.id === templateId);
        if (tpl) {
          d.exercises = tpl.exercises.map((ex) => {
            const target = state.targets[ex.id];
            return {
              name: getExerciseName(ex),
              sets: ex.defaultSets,
              weight: target ? target.weight : ex.defaultWeight,
              reps: target ? target.reps : ex.defaultReps
            };
          });
        }
      }
      renderMissedSessionModal();
    }

    function addMissedExerciseRow() {
      syncMissedDraftFromInputs();
      if (!state.missedSessionDraft) return;
      state.missedSessionDraft.exercises.push({ name: '', sets: 3, weight: 50, reps: 10 });
      renderMissedSessionModal();
    }

    function removeMissedExerciseRow(idx) {
      syncMissedDraftFromInputs();
      const d = state.missedSessionDraft;
      if (!d) return;
      if (d.exercises.length <= 1) {
        triggerToast('Keep at least 1 exercise row.');
        return;
      }
      const exName = (d.exercises[idx] && d.exercises[idx].name) || `Exercise ${idx + 1}`;
      openConfirmModal({
        title: 'Remove Exercise?',
        message: `Are you sure you want to remove "${exName}" from this session?`,
        confirmLabel: 'Remove',
        onConfirm: () => {
          d.exercises.splice(idx, 1);
          renderMissedSessionModal();
        }
      });
    }

    function renderMissedSessionModal() {
      const d = state.missedSessionDraft;
      if (!d) return;

      const templateOptions = [
        `<option value="custom" ${d.templateId === 'custom' ? 'selected' : ''}>Custom / Blank Lift Log</option>`,
        ...getAllAvailableDayTemplates().map((tpl) => `
          <option value="${tpl.id}" ${d.templateId === tpl.id ? 'selected' : ''}>${escapeHtml(tpl.shortName)}: ${escapeHtml(tpl.title)}</option>
        `)
      ].join('');

      let bodyHtml = '';
      if (d.mode === 'lifting') {
        const exRowsHtml = d.exercises.map((ex, idx) => `
          <div style="background:var(--bg-card-inner);border:1px solid var(--border-subtle);border-radius:12px;padding:10px;margin-bottom:8px;">
            <div style="display:flex;align-items:center;gap:6px;margin-bottom:8px;">
              <input
                id="missed_ex_name_${idx}"
                class="text-input"
                style="padding:8px 10px;"
                placeholder="Exercise name (e.g. Incline Dumbbell Press)"
                value="${escapeHtml(ex.name)}"
              />
              <button type="button" class="remove-set-btn" onclick="removeMissedExerciseRow(${idx})" title="Remove exercise">&#10005;</button>
            </div>
            <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;">
              <div>
                <div class="field-label" style="font-size:10px;">Sets</div>
                <input id="missed_ex_sets_${idx}" class="num-input" style="max-width:100%;" type="number" min="1" max="10" value="${ex.sets}" />
              </div>
              <div>
                <div class="field-label" style="font-size:10px;">Weight</div>
                <input id="missed_ex_weight_${idx}" class="num-input" style="max-width:100%;" type="number" step="any" min="0" value="${ex.weight}" />
              </div>
              <div>
                <div class="field-label" style="font-size:10px;">Reps</div>
                <input id="missed_ex_reps_${idx}" class="num-input" style="max-width:100%;" type="number" min="1" max="100" value="${ex.reps}" />
              </div>
            </div>
          </div>
        `).join('');

        bodyHtml = `
          <div class="grid-2">
            <div class="field-group">
              <label class="field-label" for="missedTemplateSelect">Routine Template</label>
              <select id="missedTemplateSelect" class="select-input" onchange="handleMissedTemplateSelect(this.value)">
                ${templateOptions}
              </select>
            </div>
            <div class="field-group">
              <label class="field-label" for="missedLiftDuration">Duration (MM:SS)</label>
              <input id="missedLiftDuration" class="text-input" type="text" value="${escapeHtml(d.duration)}" placeholder="e.g. 42:00" />
            </div>
          </div>

          <div class="field-label" style="margin-top:4px;">Exercises Completed</div>
          ${exRowsHtml}

          <button type="button" class="btn-secondary btn-block" style="margin-bottom:10px;" onclick="addMissedExerciseRow()">
            + Add Exercise
          </button>

          <div class="field-group">
            <label class="field-label" for="missedLiftNotes">Session Notes (Optional)</label>
            <textarea id="missedLiftNotes" class="textarea-input" rows="2" placeholder="How did the session feel?">${escapeHtml(d.notes)}</textarea>
          </div>

          <button type="button" class="btn-primary btn-block" onclick="saveMissedSession()">
            + Save Lifting Session
          </button>
        `;
      } else {
        const isSauna = d.cardioType === 'Sauna';
        const paceText = isSauna
          ? (d.saunaTemp ? `${d.saunaTemp}°F Sauna` : 'Heat Recovery')
          : (computePaceDisplay(d.cardioType, parseDurationToSeconds(d.cardioDuration), d.cardioDistance, d.saunaTemp) || 'Enter time & distance');

        bodyHtml = `
          <div class="grid-2">
            <div class="field-group">
              <label class="field-label" for="missedCardioType">Activity</label>
              <select id="missedCardioType" class="select-input" onchange="syncMissedDraftFromInputs(); renderMissedSessionModal();">
                <option value="Running" ${d.cardioType === 'Running' ? 'selected' : ''}>Running</option>
                <option value="Treadmill Walk" ${d.cardioType === 'Treadmill Walk' ? 'selected' : ''}>Treadmill Walk</option>
                <option value="Biking" ${d.cardioType === 'Biking' ? 'selected' : ''}>Biking</option>
                <option value="Row Indoor" ${d.cardioType === 'Row Indoor' ? 'selected' : ''}>Row Indoor</option>
                <option value="Stair Stepper" ${d.cardioType === 'Stair Stepper' ? 'selected' : ''}>Stair Stepper</option>
                <option value="Sauna" ${d.cardioType === 'Sauna' ? 'selected' : ''}>Sauna</option>
              </select>
            </div>
            <div class="field-group">
              <label class="field-label" for="missedCardioEnv">Setting</label>
              <select id="missedCardioEnv" class="select-input">
                <option value="Outside" ${d.cardioEnv === 'Outside' ? 'selected' : ''}>Outside</option>
                <option value="Inside" ${d.cardioEnv === 'Inside' ? 'selected' : ''}>Inside</option>
              </select>
            </div>
          </div>

          <div class="grid-2">
            <div class="field-group">
              <label class="field-label" for="missedCardioDuration">Duration (MM:SS)</label>
              <input id="missedCardioDuration" class="text-input" type="text" value="${escapeHtml(d.cardioDuration)}" placeholder="e.g. 25:00" oninput="updateCardioPacePreview('missedCardio')" />
            </div>
            ${isSauna
              ? `<div class="field-group">
                   <label class="field-label" for="missedSaunaTemp">Sauna Temp (°F)</label>
                   <input id="missedSaunaTemp" class="text-input" type="number" inputmode="numeric" value="${escapeHtml(d.saunaTemp)}" placeholder="e.g. 185" oninput="updateCardioPacePreview('missedCardio')" />
                 </div>`
              : `<div class="field-group">
                   <label class="field-label" for="missedCardioDistance">Distance (mi / m / flr)</label>
                   <input id="missedCardioDistance" class="text-input" type="number" step="any" inputmode="decimal" value="${escapeHtml(d.cardioDistance)}" placeholder="e.g. 2.0" oninput="updateCardioPacePreview('missedCardio')" />
                 </div>`
            }
          </div>

          <div class="pace-preview-bar">
            <span style="font-size:11px;font-weight:800;color:var(--text-secondary);">Calculated Pace</span>
            <span id="missedCardioPacePreview" class="badge badge-sky">${escapeHtml(paceText)}</span>
          </div>

          <div class="field-group">
            <label class="field-label" for="missedCardioNotes">Session Notes (Optional)</label>
            <input id="missedCardioNotes" class="text-input" type="text" value="${escapeHtml(d.cardioNotes)}" placeholder="How did breathing, legs, or heat feel?" />
          </div>

          <button type="button" class="btn-primary btn-block" onclick="saveMissedSession()">
            + Save ${isSauna ? 'Sauna' : 'Cardio'} Session
          </button>
        `;
      }

      openModal(`
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;">
          <h3 style="margin:0;font-size:15px;font-weight:900;">Log Missed / Past Session</h3>
          <button type="button" class="icon-btn" onclick="closeModal()">&#10005;</button>
        </div>

        <div class="segment-toggle">
          <button type="button" class="segment-btn ${d.mode === 'lifting' ? 'active' : ''}" onclick="setMissedSessionMode('lifting')">&#127947; Lifting</button>
          <button type="button" class="segment-btn ${d.mode === 'cardio' ? 'active' : ''}" onclick="setMissedSessionMode('cardio')">&#127939; Cardio / Sauna</button>
        </div>

        <div class="field-group">
          <label class="field-label" for="missedSessionDate">Session Date</label>
          <input id="missedSessionDate" class="text-input" type="date" value="${escapeHtml(d.date)}" />
        </div>

        ${bodyHtml}
      `);
    }

    function saveMissedSession() {
      syncMissedDraftFromInputs();
      const d = state.missedSessionDraft;
      if (!d) return;

      const isoDate = d.date || getYesterdayIsoDate();
      const formattedDate = formatIsoDateLabel(isoDate);
      const stampedAt = formatDateTimeStamp(isoDate);

      if (d.mode === 'lifting') {
        const validExercises = d.exercises.filter((ex) => String(ex.name || '').trim().length > 0);
        if (validExercises.length === 0) {
          triggerToast('Enter at least one exercise name.');
          return;
        }

        const durationSec = parseDurationToSeconds(d.duration) || 2400;
        let totalSets = 0;
        let totalVolume = 0;

        const completedEx = validExercises.map((ex, idx) => {
          const setsArr = [];
          for (let s = 1; s <= ex.sets; s++) {
            setsArr.push({ setNum: s, weight: ex.weight, reps: ex.reps });
          }
          const exVol = ex.sets * ex.weight * ex.reps;
          totalSets += ex.sets;
          totalVolume += exVol;
          return {
            id: `past_ex_${Date.now()}_${idx}`,
            name: ex.name.trim(),
            originalName: ex.name.trim(),
            isSwapped: false,
            swapType: null,
            effort: 3,
            volume: exVol,
            sets: setsArr
          };
        });

        const tpl = getAllAvailableDayTemplates().find((t) => t.id === d.templateId);
        const dayTitle = tpl ? `${tpl.shortName}: ${tpl.title}` : 'Custom Lift Session';

        state.history.unshift({
          id: `h_${Date.now()}`,
          isoDate,
          date: formattedDate,
          completedAt: stampedAt,
          dayId: tpl ? tpl.id : 'custom',
          dayTitle,
          isDaySwapped: false,
          durationFormatted: formatStopwatch(durationSec),
          durationSeconds: durationSec,
          totalSets,
          totalVolume,
          sessionNote: (d.notes || '').trim(),
          exercises: completedEx
        });

        state.calendarMonth = isoDate.slice(0, 7);
        state.selectedCalendarDate = isoDate;
        state.missedSessionDraft = null;
        saveState();
        closeModal();
        renderProgressTab();
        triggerToast(`Logged lifting session for ${formattedDate}`);
      } else {
        const durSec = parseDurationToSeconds(d.cardioDuration);
        if (durSec <= 0) {
          triggerToast('Enter duration like 25:00');
          return;
        }
        const type = d.cardioType;
        const isSauna = type === 'Sauna';
        const dist = isSauna ? 0 : (parseFloat(d.cardioDistance) || 0);
        const unit = type === 'Row Indoor' ? 'm' : (type === 'Stair Stepper' ? 'floors' : 'mi');
        const paceDisplay = computePaceDisplay(type, durSec, dist, d.saunaTemp) || 'Logged';

        state.cardioLogs.unshift({
          id: `c_${Date.now()}`,
          isoDate,
          date: formattedDate,
          completedAt: stampedAt,
          type,
          environment: isSauna ? 'Inside' : d.cardioEnv,
          durationSeconds: durSec,
          durationFormatted: formatDurationMMSS(durSec),
          distance: dist,
          unit,
          saunaTemp: d.saunaTemp || '',
          paceDisplay,
          notes: (d.cardioNotes || '').trim()
        });

        state.calendarMonth = isoDate.slice(0, 7);
        state.selectedCalendarDate = isoDate;
        state.missedSessionDraft = null;
        saveState();
        closeModal();
        renderProgressTab();
        triggerToast(`Logged ${type} for ${formattedDate}`);
      }
    }

    function buildActivityMapByIsoDate() {
      const map = {};
      state.history.forEach((w) => {
        const iso = resolveItemIsoDate(w);
        if (!iso) return;
        if (!map[iso]) map[iso] = { lift: 0, cardio: 0, sauna: 0 };
        map[iso].lift += 1;
      });
      state.cardioLogs.forEach((c) => {
        const iso = resolveItemIsoDate(c);
        if (!iso) return;
        if (!map[iso]) map[iso] = { lift: 0, cardio: 0, sauna: 0 };
        if (c.type === 'Sauna') map[iso].sauna += 1;
        else map[iso].cardio += 1;
      });
      return map;
    }

    function renderProgressTab() {
      const totalSessions = state.history.length;
      const totalVolumeAll = state.history.reduce((sum, w) => sum + (Number(w.totalVolume) || 0), 0);

      const todayIso = getLocalIsoDate();
      const activeMonth = state.calendarMonth && /^\d{4}-\d{2}$/.test(state.calendarMonth)
        ? state.calendarMonth
        : todayIso.slice(0, 7);
      const [calYear, calMonthNum] = activeMonth.split('-').map(Number);
      const monthStart = new Date(calYear, calMonthNum - 1, 1);
      const monthTitle = monthStart.toLocaleDateString('en-US', { month: 'long', year: 'numeric' });
      const firstWeekday = monthStart.getDay();
      const daysInMonth = new Date(calYear, calMonthNum, 0).getDate();
      const activityByDate = buildActivityMapByIsoDate();

      const cells = [];
      for (let i = 0; i < firstWeekday; i++) {
        cells.push('<div class="cal-day-cell empty"></div>');
      }
      for (let dayNum = 1; dayNum <= daysInMonth; dayNum++) {
        const iso = `${calYear}-${String(calMonthNum).padStart(2, '0')}-${String(dayNum).padStart(2, '0')}`;
        const act = activityByDate[iso] || { lift: 0, cardio: 0, sauna: 0 };
        const hasAny = act.lift > 0 || act.cardio > 0 || act.sauna > 0;
        const isSelected = state.selectedCalendarDate === iso;
        const isToday = iso === todayIso;

        const dots = [];
        if (act.lift > 0) dots.push('<span class="cal-dot lift" title="Lifted"></span>');
        if (act.cardio > 0) dots.push('<span class="cal-dot cardio" title="Cardio"></span>');
        if (act.sauna > 0) dots.push('<span class="cal-dot sauna" title="Sauna"></span>');

        cells.push(`
          <button
            type="button"
            class="cal-day-cell ${hasAny ? 'has-activity' : ''} ${isToday ? 'today' : ''} ${isSelected ? 'selected' : ''}"
            onclick="selectCalendarDate('${iso}')"
          >
            <span class="cal-day-num">${dayNum}</span>
            <span class="cal-dots-row">${dots.join('')}</span>
          </button>
        `);
      }

      // Unified chronological feed of Lifting + Cardio + Sauna
      const unifiedFeed = [
        ...state.history.map((w) => ({
          kind: 'lift',
          isoDate: resolveItemIsoDate(w),
          sortKey: Number(String(w.id || '').replace(/\D/g, '')) || 0,
          data: w
        })),
        ...state.cardioLogs.map((c) => ({
          kind: c.type === 'Sauna' ? 'sauna' : 'cardio',
          isoDate: resolveItemIsoDate(c),
          sortKey: Number(String(c.id || '').replace(/\D/g, '')) || 0,
          data: c
        }))
      ].sort((a, b) => {
        if (a.isoDate && b.isoDate && a.isoDate !== b.isoDate) {
          return b.isoDate.localeCompare(a.isoDate);
        }
        return b.sortKey - a.sortKey;
      });

      const filteredFeed = state.selectedCalendarDate
        ? unifiedFeed.filter((entry) => entry.isoDate === state.selectedCalendarDate)
        : unifiedFeed;

      const filterBarHtml = state.selectedCalendarDate
        ? `
          <div class="card" style="padding:10px 12px;border-color:rgba(16,185,129,0.4);background:rgba(16,185,129,0.08);">
            <div style="display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;">
              <span style="font-size:12px;font-weight:800;color:#6ee7b7;">Showing ${escapeHtml(formatIsoDateLabel(state.selectedCalendarDate))}</span>
              <div style="display:flex;gap:6px;">
                <button type="button" class="btn-primary btn-compact" onclick="openLogPastSessionModal('${state.selectedCalendarDate}')">+ Log on Date</button>
                <button type="button" class="btn-secondary btn-compact" onclick="clearCalendarSelection()">Show All</button>
              </div>
            </div>
          </div>
        `
        : '';

      const feedHtml = filteredFeed.length === 0
        ? `<div class="card"><p class="card-subtitle">${state.selectedCalendarDate ? 'No activity logged on this date yet.' : 'No activity logged yet. Complete a workout or log a cardio/sauna session to see your history here.'}</p></div>`
        : filteredFeed.map((entry) => {
            if (entry.kind === 'lift') {
              const w = entry.data;
              const isExpanded = Boolean(state.expandedHistory && state.expandedHistory[w.id]);
              const stampLabel = w.completedAt || w.date;
              const exDetailsHtml = (w.exercises || []).map((e) => {
                const setsDetail = (e.sets || [])
                  .map((s) => `${s.weight}×${s.reps}`)
                  .join(', ');
                const swapLine = e.isSwapped
                  ? `<div style="font-size:11px;color:#c7d2fe;margin-top:2px;">&#8644; ${escapeHtml(e.swapType || 'Swapped')} from ${escapeHtml(e.originalName || 'default')}</div>`
                  : '';
                return `
                  <div style="padding:7px 0;border-bottom:1px solid var(--border-subtle);">
                    <div style="display:flex;justify-content:space-between;align-items:center;gap:6px;">
                      <span style="font-size:12px;font-weight:800;color:#fff;">${escapeHtml(e.name)}</span>
                      <span class="badge badge-indigo">Effort ${e.effort}/5</span>
                    </div>
                    ${swapLine}
                    <div style="font-size:11px;color:var(--text-secondary);margin-top:3px;">${escapeHtml(setsDetail)} (${Number(e.volume || 0).toLocaleString()} lbs)</div>
                  </div>
                `;
              }).join('');

              return `
                <div class="card">
                  <div class="card-header-row" style="cursor:pointer;" onclick="toggleHistoryExpand('${w.id}')">
                    <div style="min-width:0;flex:1;">
                      <h3 class="card-title">&#127947; ${escapeHtml(w.dayTitle)}</h3>
                      <p class="card-subtitle">${escapeHtml(stampLabel)} • Time: ${escapeHtml(w.durationFormatted || '0:00')} • ${isExpanded ? 'Hide Details ▲' : 'Tap for Details ▼'}</p>
                    </div>
                    <div style="display:flex;align-items:center;gap:6px;flex-shrink:0;" onclick="event.stopPropagation()">
                      <button type="button" class="delete-row-btn" onclick="deleteWorkoutHistory('${w.id}')" title="Delete workout entry">Delete</button>
                    </div>
                  </div>
                  ${isExpanded ? `
                    <div class="history-detail-panel">
                      <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px;">
                        <span class="badge badge-emerald">${Number(w.totalVolume || 0).toLocaleString()} lbs volume</span>
                        <span class="badge badge-amber">${w.totalSets} sets</span>
                      </div>
                      ${exDetailsHtml}
                      ${w.sessionNote ? `<div class="cue-box"><strong>Session Note:</strong> ${escapeHtml(w.sessionNote)}</div>` : ''}
                    </div>
                  ` : ''}
                </div>
              `;
            }

            const c = entry.data;
            const stampLabel = c.completedAt || c.date;
            const icon = c.type === 'Sauna' ? '&#128293;' : '&#127939;';
            const badgeClass = c.type === 'Sauna' ? 'badge-amber' : 'badge-sky';

            return `
              <div class="card">
                <div class="card-header-row">
                  <div style="min-width:0;flex:1;">
                    <h3 class="card-title">${icon} ${escapeHtml(c.type)}</h3>
                    <p class="card-subtitle">${escapeHtml(stampLabel)} • ${escapeHtml(c.environment)} • ${escapeHtml(c.durationFormatted)}${c.distance > 0 ? ` • ${c.distance} ${escapeHtml(c.unit)}` : ''}</p>
                  </div>
                  <div style="display:flex;align-items:center;gap:6px;flex-shrink:0;">
                    <span class="badge ${badgeClass}">${escapeHtml(c.paceDisplay)}</span>
                    <button type="button" class="delete-row-btn" onclick="deleteCardioLog('${c.id}')" title="Delete entry">Delete</button>
                  </div>
                </div>
                ${c.notes ? `<p class="card-subtitle" style="margin-top:8px;">${escapeHtml(c.notes)}</p>` : ''}
              </div>
            `;
          }).join('');

      const html = `
        <div class="grid-2" style="margin-bottom:12px;">
          <div class="card" style="margin-bottom:0;">
            <div class="field-label">Completed Workouts</div>
            <div style="font-size:22px;font-weight:900;color:#fff;">${totalSessions}</div>
          </div>
          <div class="card" style="margin-bottom:0;">
            <div class="field-label">Total Volume Lifted</div>
            <div style="font-size:22px;font-weight:900;color:var(--emerald);">${totalVolumeAll.toLocaleString()}</div>
          </div>
        </div>

        <div class="card">
          <div class="calendar-header">
            <button type="button" class="icon-btn" onclick="changeCalendarMonth(-1)" aria-label="Previous month">&#8249;</button>
            <span class="calendar-month-label">${escapeHtml(monthTitle)}</span>
            <button type="button" class="icon-btn" onclick="changeCalendarMonth(1)" aria-label="Next month">&#8250;</button>
          </div>
          <div class="calendar-weekdays">
            <div class="calendar-weekday">Sun</div>
            <div class="calendar-weekday">Mon</div>
            <div class="calendar-weekday">Tue</div>
            <div class="calendar-weekday">Wed</div>
            <div class="calendar-weekday">Thu</div>
            <div class="calendar-weekday">Fri</div>
            <div class="calendar-weekday">Sat</div>
          </div>
          <div class="calendar-grid">${cells.join('')}</div>
          <div class="calendar-legend">
            <span class="legend-item"><span class="cal-dot lift"></span>Lifted</span>
            <span class="legend-item"><span class="cal-dot cardio"></span>Cardio</span>
            <span class="legend-item"><span class="cal-dot sauna"></span>Sauna</span>
          </div>
        </div>

        <button type="button" class="btn-secondary btn-block" style="margin-bottom:12px;" onclick="openLogPastSessionModal()">
          + Log Missed / Past Session
        </button>

        ${filterBarHtml}
        ${feedHtml}
      `;

      document.getElementById('appMain').innerHTML = html;
    }

    function buildCoachContext() {
      const day = getEffectiveDay(state.selectedDayId);
      const exercises = getDayExercises(day.id);
      const exLines = exercises.map((ex) => {
        const rows = (state.setsByDay[day.id] && state.setsByDay[day.id][ex.id]) || [];
        const effort = state.efforts[ex.id] || 3;
        const swapInfo = getExerciseSwapInfo(ex);
        const swapTag = swapInfo.isSwapped ? ` [${swapInfo.swapType} from ${swapInfo.originalName}]` : '';
        const setStr = rows.map((r) => `${r.weight}x${r.reps}${r.done ? '(done)' : ''}`).join(', ');
        return `- ${swapInfo.activeName}${swapTag} [Effort ${effort}/5]: ${setStr}`;
      }).join('\n');

      const recentHistory = state.history.slice(0, 4).map((w) => {
        const notePart = w.sessionNote ? ` | Note: "${w.sessionNote}"` : '';
        const stamp = w.completedAt || w.date;
        const exList = (w.exercises || []).map((e) => {
          const sTag = e.isSwapped ? ` (${e.swapType} from ${e.originalName})` : '';
          return `${e.name}${sTag} [Effort ${e.effort}/5]`;
        }).join('; ');
        return `- ${stamp} — ${w.dayTitle} (${w.durationFormatted}, ${w.totalVolume} lbs vol): ${exList}${notePart}`;
      }).join('\n');

      const recentCardio = state.cardioLogs.slice(0, 5).map((c) => {
        const stamp = c.completedAt || c.date;
        const notePart = c.notes ? ` (${c.notes})` : '';
        return `- ${stamp}: ${c.type} ${c.durationFormatted} @ ${c.paceDisplay}${notePart}`;
      }).join('\n');

      return `Active Day: ${day.shortName} - ${day.title}${day.isDaySwapped ? ' (Swapped Day)' : ''}\nCurrent Sets:\n${exLines}\n\nRecent Workouts:\n${recentHistory || 'None'}\n\nRecent Cardio/Sauna:\n${recentCardio || 'None'}`;
    }

    function saveCoachKey() {
      const input = document.getElementById('geminiKeyInput');
      if (!input) return;
      state.geminiApiKey = input.value.trim();
      saveState();
      triggerToast('Saved Gemini API key on this device');
    }

    async function sendCoachMessage(customPrompt) {
      const input = document.getElementById('coachPromptInput');
      const text = (customPrompt || (input ? input.value : '')).trim();
      if (!text) return;
      if (!customPrompt && input) input.value = '';

      state.coachMessages.push({ role: 'user', text });
      saveState();
      renderCoachTab();

      const context = buildCoachContext();
      const systemInstruction = `You are Coach Chad, a sharp, encouraging strength & conditioning coach inside THE PROCESS app. Keep replies concise, actionable, and easy to read on a phone between sets. Pay close attention to any exercise swaps (preset or custom) noted in the athlete's logs.\n\nAthlete Context:\n${context}`;

      if (!state.geminiApiKey) {
        const fallback = `Coach Chad (Offline Mode): Add your free Gemini API key above for live AI coaching. Based on your current ${getEffectiveDay(state.selectedDayId).title} log, bump weight next time on any exercise rated 1-2/5 effort with clean reps, hold weight if effort hit 5/5, and keep logging your swaps and session notes.`;
        state.coachMessages.push({ role: 'chad', text: fallback });
        saveState();
        renderCoachTab();
        return;
      }

      try {
        const modelsToTry = ['gemini-3-flash-preview', 'gemini-2.5-flash'];
        let reply = '';
        let lastApiError = '';

        for (const modelName of modelsToTry) {
          const url = `https://generativelanguage.googleapis.com/v1beta/models/${modelName}:generateContent?key=${encodeURIComponent(state.geminiApiKey)}`;
          const resp = await fetch(url, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              systemInstruction: { parts: [{ text: systemInstruction }] },
              contents: [{ role: 'user', parts: [{ text }] }]
            })
          });
          const data = await resp.json();
          if (resp.ok && data?.candidates?.[0]?.content?.parts?.[0]?.text) {
            reply = data.candidates[0].content.parts[0].text;
            break;
          }
          lastApiError = data?.error?.message || `HTTP ${resp.status}`;
        }

        if (reply) {
          state.coachMessages.push({ role: 'chad', text: reply });
        } else {
          state.coachMessages.push({
            role: 'chad',
            text: `Gemini API returned an error: ${lastApiError || 'No response received'}. Double-check that your AI Studio key is pasted cleanly without extra spaces.`
          });
        }
      } catch (err) {
        state.coachMessages.push({ role: 'chad', text: 'Could not reach Gemini API right now. Check your API key or connection and try again.' });
      }

      saveState();
      renderCoachTab();
    }

    function renderCoachTab() {
      const bubblesHtml = state.coachMessages.map((m) => `
        <div class="chat-bubble ${m.role === 'user' ? 'user' : 'chad'}">${escapeHtml(m.text)}</div>
      `).join('');

      const html = `
        <div class="card">
          <div class="field-group" style="margin-bottom:8px;">
            <label class="field-label" for="geminiKeyInput">Gemini API Key (Optional — Saved on Device)</label>
            <div style="display:flex;gap:8px;">
              <input id="geminiKeyInput" class="text-input" type="password" value="${escapeHtml(state.geminiApiKey)}" placeholder="Paste AI Studio API key..." />
              <button type="button" class="btn-secondary" onclick="saveCoachKey()">Save</button>
            </div>
          </div>
          <div style="display:flex;gap:8px;flex-wrap:wrap;">
            <button type="button" class="btn-secondary" onclick="sendCoachMessage('Review my current workout sets, exercise swaps, effort ratings, and recent session notes and give me my next progression step.')">Analyze Today's Session</button>
            <button type="button" class="btn-secondary" onclick="sendCoachMessage('Check my recent cardio and sauna sessions alongside my lifting and tell me how to pace recovery.')">Cardio &amp; Recovery Check</button>
          </div>
        </div>

        <div class="card">
          <div id="coachChatList" class="chat-list">${bubblesHtml}</div>
          <div style="display:flex;gap:8px;">
            <input id="coachPromptInput" class="text-input" type="text" placeholder="Ask Coach Chad anything..." onkeydown="if(event.key==='Enter'){sendCoachMessage();}" />
            <button type="button" class="btn-primary" onclick="sendCoachMessage()">Send</button>
          </div>
        </div>
      `;

      document.getElementById('appMain').innerHTML = html;
      const listEl = document.getElementById('coachChatList');
      if (listEl) listEl.scrollTop = listEl.scrollHeight;
    }

    function openModal(innerHtml) {
      const backdrop = document.getElementById('modalBackdrop');
      const card = document.getElementById('modalCard');
      if (!backdrop || !card) return;
      card.innerHTML = innerHtml;
      backdrop.classList.add('open');
    }

    function closeModal() {
      const backdrop = document.getElementById('modalBackdrop');
      if (backdrop) backdrop.classList.remove('open');
    }

    function handleBackdropClick(e) {
      if (e.target && e.target.id === 'modalBackdrop') closeModal();
    }

    function switchTab(tabName) {
      state.activeTab = tabName;
      saveState();
      ['workout', 'cardio', 'progress', 'coach'].forEach((t) => {
        const btn = document.getElementById(`nav-${t}`);
        if (btn) btn.classList.toggle('active', t === tabName);
      });

      if (tabName === 'cardio') renderCardioTab();
      else if (tabName === 'progress') renderProgressTab();
      else if (tabName === 'coach') renderCoachTab();
      else renderWorkoutTab();
    }

    window.addEventListener('DOMContentLoaded', async () => {
      loadState();
      updateSyncPillUI();
      updateTimerUI();
      switchTab(state.activeTab || 'workout');
      if (state.supabaseUrl && state.supabaseAnonKey) {
        await pullStateFromSupabase(false);
      }
    });
  </script>
</body>
</html>
