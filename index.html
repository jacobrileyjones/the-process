<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>THE PROCESS</title>
  <style>
    :root {
      --bg-page: #060911;
      --bg-card: #0f172a;
      --bg-card-inner: #1e293b;
      --bg-input: #090d16;
      --border-subtle: rgba(148, 163, 184, 0.16);
      --border-strong: rgba(148, 163, 184, 0.28);
      --text-primary: #f8fafc;
      --text-secondary: #94a3b8;
      --text-muted: #64748b;
      --emerald: #10b981;
      --emerald-hover: #059669;
      --emerald-soft: rgba(16, 185, 129, 0.14);
      --amber: #f59e0b;
      --sky: #38bdf8;
      --rose: #f43f5e;
      --indigo: #818cf8;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html {
      margin: 0;
      padding: 0;
      background-color: var(--bg-page);
      color: var(--text-primary);
      font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-size: 14px;
      line-height: 1.45;
      -webkit-text-size-adjust: 100%;
    }

    body {
      margin: 0;
      padding: 0;
      background-color: var(--bg-page);
      color: var(--text-primary);
      min-height: 100%;
      width: 100%;
    }

    .app-shell {
      min-height: 100vh;
      padding-top: calc(52px + env(safe-area-inset-top));
      padding-bottom: calc(96px + env(safe-area-inset-bottom));
      width: 100%;
      overflow-x: clip;
    }

    .container {
      width: 100%;
      max-width: 680px;
      margin: 0 auto;
      padding: 0 12px;
    }

    /* Top Header */
    .topbar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 30;
      background: #060911;
      border-bottom: 1px solid var(--border-subtle);
      padding-top: calc(8px + env(safe-area-inset-top));
      padding-bottom: 8px;
    }

    .topbar-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .brand-title {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 0;
      font-size: 15px;
      font-weight: 900;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--text-primary);
    }

    .brand-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 24px;
      height: 24px;
      border-radius: 8px;
      background: var(--emerald-soft);
      border: 1px solid rgba(16, 185, 129, 0.45);
      color: var(--emerald);
      font-size: 12px;
    }

    .topbar-right {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }

    .sync-pill {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: 999px;
      padding: 5px 9px;
      font-size: 11px;
      font-weight: 800;
      color: var(--text-secondary);
      cursor: pointer;
    }

    .sync-pill.synced {
      border-color: rgba(16, 185, 129, 0.45);
      background: var(--emerald-soft);
      color: #6ee7b7;
    }

    .sync-pill.error {
      border-color: rgba(244, 63, 94, 0.45);
      background: rgba(244, 63, 94, 0.14);
      color: #fda4af;
    }

    .session-status-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: 999px;
      padding: 5px 10px;
      font-size: 11px;
      font-weight: 800;
      color: var(--text-secondary);
    }

    .session-status-pill.active {
      border-color: rgba(16, 185, 129, 0.45);
      background: var(--emerald-soft);
      color: #6ee7b7;
    }

    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 999px;
      background: var(--text-muted);
    }

    .session-status-pill.active .status-dot {
      background: var(--emerald);
    }

    .icon-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 30px;
      height: 30px;
      border-radius: 8px;
      border: 1px solid var(--border-subtle);
      background: var(--bg-card-inner);
      color: var(--text-primary);
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
    }

    .icon-btn:active {
      transform: scale(0.96);
    }

    /* Main Content */
    .main-content {
      padding-top: 12px;
    }

    /* Day Selector */
    .day-scroller {
      display: flex;
      gap: 7px;
      overflow-x: auto;
      padding-bottom: 6px;
      margin-bottom: 12px;
      scrollbar-width: none;
    }

    .day-scroller::-webkit-scrollbar {
      display: none;
    }

    .day-pill {
      flex: 1 0 auto;
      min-width: 74px;
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: 14px;
      padding: 8px 8px;
      text-align: center;
      cursor: pointer;
      color: var(--text-secondary);
    }

    .day-pill.active {
      background: var(--emerald-soft);
      border-color: var(--emerald);
      color: var(--text-primary);
    }

    .day-pill-num {
      display: block;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      opacity: 0.8;
    }

    .day-pill-name {
      display: block;
      font-size: 12px;
      font-weight: 800;
      margin-top: 2px;
      white-space: nowrap;
    }

    /* Silent Session Control Banner */
    .session-control-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      background: linear-gradient(135deg, rgba(16, 185, 129, 0.14), rgba(15, 23, 42, 0.95));
      border: 1px solid rgba(16, 185, 129, 0.35);
      border-radius: 16px;
      padding: 11px 14px;
      margin-bottom: 12px;
    }

    /* Cards */
    .card {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: 16px;
      padding: 13px;
      margin-bottom: 12px;
      width: 100%;
    }

    .card-header-row {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 8px;
    }

    .card-title {
      margin: 0;
      font-size: 15px;
      font-weight: 800;
      color: var(--text-primary);
      word-break: break-word;
    }

    .card-subtitle {
      margin: 3px 0 0 0;
      font-size: 12px;
      color: var(--text-secondary);
    }

    .day-banner {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 8px;
    }

    .swap-day-actions {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      padding: 3px 8px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 700;
      border: 1px solid transparent;
      white-space: nowrap;
    }

    .badge-emerald {
      background: var(--emerald-soft);
      color: #6ee7b7;
      border-color: rgba(16, 185, 129, 0.35);
    }

    .badge-sky {
      background: rgba(56, 189, 248, 0.14);
      color: #7dd3fc;
      border-color: rgba(56, 189, 248, 0.35);
    }

    .badge-amber {
      background: rgba(245, 158, 11, 0.14);
      color: #fcd34d;
      border-color: rgba(245, 158, 11, 0.35);
    }

    .badge-indigo {
      background: rgba(129, 140, 248, 0.14);
      color: #c7d2fe;
      border-color: rgba(129, 140, 248, 0.35);
    }

    /* Buttons */
    .btn-primary {
      background: var(--emerald);
      color: #04130d;
      border: none;
      border-radius: 12px;
      padding: 10px 14px;
      font-size: 13px;
      font-weight: 800;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      touch-action: manipulation;
    }

    .btn-primary:hover {
      background: var(--emerald-hover);
    }

    .btn-primary:active {
      transform: scale(0.98);
    }

    .btn-secondary {
      background: var(--bg-card-inner);
      color: var(--text-primary);
      border: 1px solid var(--border-strong);
      border-radius: 12px;
      padding: 8px 11px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      flex-shrink: 0;
      touch-action: manipulation;
    }

    .btn-secondary:active {
      transform: scale(0.98);
    }

    .btn-compact {
      padding: 6px 10px;
      font-size: 11px;
      border-radius: 10px;
    }

    .btn-danger {
      background: rgba(244, 63, 94, 0.16);
      color: #fda4af;
      border: 1px solid rgba(244, 63, 94, 0.45);
      border-radius: 12px;
      padding: 10px 14px;
      font-size: 13px;
      font-weight: 800;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      touch-action: manipulation;
    }

    .btn-block {
      width: 100%;
    }

    .day-option-card {
      background: var(--bg-card-inner);
      border: 1px solid var(--border-subtle);
      border-radius: 12px;
      padding: 11px 12px;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      cursor: pointer;
    }

    .day-option-card.active {
      border-color: var(--emerald);
      background: rgba(16, 185, 129, 0.08);
    }

    .day-option-badge {
      flex-shrink: 0;
      min-width: 74px;
      height: 28px;
      padding: 0 10px;
      justify-content: center;
      white-space: nowrap;
    }

    /* Set Table — sized cleanly for narrow iPhones */
    .sets-table {
      width: 100%;
      table-layout: fixed;
      border-collapse: collapse;
      margin-top: 10px;
    }

    .sets-table th {
      font-size: 10px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      text-align: center;
      padding: 0 2px 6px 2px;
    }

    .sets-table th:nth-child(1) { width: 34px; }
    .sets-table th:nth-child(2) { width: auto; }
    .sets-table th:nth-child(3) { width: auto; }
    .sets-table th:nth-child(4) { width: 42px; }
    .sets-table th:nth-child(5) { width: 34px; }

    .sets-table td {
      padding: 3px 2px;
      text-align: center;
      vertical-align: middle;
    }

    .set-num-pill {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 24px;
      height: 24px;
      border-radius: 8px;
      background: var(--bg-card-inner);
      font-size: 12px;
      font-weight: 800;
      color: var(--text-secondary);
    }

    .num-input {
      width: 100%;
      max-width: 76px;
      background: var(--bg-input);
      border: 1px solid var(--border-subtle);
      border-radius: 10px;
      padding: 7px 4px;
      color: var(--text-primary);
      font-size: 16px;
      font-weight: 700;
      text-align: center;
      touch-action: manipulation;
    }

    .num-input:focus {
      outline: none;
      border-color: var(--emerald);
    }

    .done-check-btn {
      width: 34px;
      height: 34px;
      border-radius: 10px;
      border: 1px solid var(--border-strong);
      background: var(--bg-input);
      color: var(--text-muted);
      font-size: 15px;
      font-weight: 900;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      touch-action: manipulation;
    }

    .done-check-btn.completed {
      background: var(--emerald);
      border-color: var(--emerald);
      color: #04130d;
    }

    .remove-set-btn {
      width: 26px;
      height: 26px;
      border-radius: 8px;
      border: 1px solid rgba(244, 63, 94, 0.3);
      background: rgba(244, 63, 94, 0.1);
      color: #fda4af;
      font-size: 12px;
      font-weight: 800;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      touch-action: manipulation;
    }

    .remove-set-btn:active {
      transform: scale(0.95);
    }

    /* Effort Scale 1-5 */
    .effort-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px solid var(--border-subtle);
    }

    .effort-buttons {
      display: flex;
      gap: 4px;
    }

    .effort-btn {
      width: 28px;
      height: 28px;
      border-radius: 8px;
      border: 1px solid var(--border-subtle);
      background: var(--bg-card-inner);
      color: var(--text-secondary);
      font-size: 12px;
      font-weight: 800;
      cursor: pointer;
      touch-action: manipulation;
    }

    .effort-btn.selected {
      background: var(--emerald);
      border-color: var(--emerald);
      color: #04130d;
    }

    /* Cue & Expandable History Boxes */
    .cue-box {
      margin-top: 10px;
      background: var(--bg-card-inner);
      border: 1px solid var(--border-subtle);
      border-radius: 12px;
      padding: 10px 12px;
      font-size: 12px;
      color: var(--text-secondary);
    }

    .history-detail-panel {
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px solid var(--border-subtle);
    }

    .delete-row-btn {
      background: rgba(244, 63, 94, 0.12);
      color: #fda4af;
      border: 1px solid rgba(244, 63, 94, 0.35);
      border-radius: 8px;
      padding: 4px 8px;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
      touch-action: manipulation;
    }

    .delete-row-btn:active {
      transform: scale(0.96);
    }

    .ex-title-wrap {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    .info-i-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 18px;
      height: 18px;
      border-radius: 999px;
      border: 1px solid var(--border-strong);
      background: var(--bg-card-inner);
      color: var(--text-secondary);
      font-size: 11px;
      font-weight: 800;
      font-style: italic;
      font-family: Georgia, serif;
      line-height: 1;
      padding: 0;
      cursor: pointer;
      flex-shrink: 0;
    }

    .info-i-btn.active {
      background: var(--emerald-soft);
      border-color: var(--emerald);
      color: var(--emerald);
    }

    /* Monthly Activity Calendar */
    .calendar-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
    }

    .calendar-month-label {
      font-size: 14px;
      font-weight: 900;
      color: var(--text-primary);
    }

    .calendar-weekdays {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 4px;
      margin-bottom: 4px;
    }

    .calendar-weekday {
      text-align: center;
      font-size: 10px;
      font-weight: 800;
      color: var(--text-muted);
      text-transform: uppercase;
    }

    .calendar-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 4px;
    }

    .cal-day-cell {
      aspect-ratio: 1 / 1;
      min-height: 40px;
      background: var(--bg-input);
      border: 1px solid var(--border-subtle);
      border-radius: 10px;
      padding: 4px 2px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      color: var(--text-secondary);
    }

    .cal-day-cell.empty {
      background: transparent;
      border-color: transparent;
      cursor: default;
    }

    .cal-day-cell.has-activity {
      border-color: rgba(148, 163, 184, 0.34);
      color: var(--text-primary);
    }

    .cal-day-cell.today {
      border-color: rgba(16, 185, 129, 0.55);
    }

    .cal-day-cell.selected {
      background: var(--emerald-soft);
      border-color: var(--emerald);
      color: #ffffff;
    }

    .cal-day-num {
      font-size: 11px;
      font-weight: 800;
      line-height: 1;
    }

    .cal-dots-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 3px;
      min-height: 7px;
    }

    .cal-dot {
      width: 6px;
      height: 6px;
      border-radius: 999px;
      display: inline-block;
    }

    .cal-dot.lift { background: var(--emerald); }
    .cal-dot.cardio { background: var(--sky); }
    .cal-dot.sauna { background: var(--amber); }

    .calendar-legend {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      margin-top: 10px;
      padding-top: 8px;
      border-top: 1px solid var(--border-subtle);
      font-size: 11px;
      font-weight: 700;
      color: var(--text-secondary);
    }

    .legend-item {
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }

    /* Segmented Toggle */
    .segment-toggle {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      background: var(--bg-input);
      border: 1px solid var(--border-subtle);
      border-radius: 12px;
      padding: 4px;
      margin-bottom: 12px;
    }

    .segment-btn {
      border: none;
      border-radius: 9px;
      padding: 8px 10px;
      font-size: 12px;
      font-weight: 800;
      cursor: pointer;
      background: transparent;
      color: var(--text-secondary);
    }

    .segment-btn.active {
      background: var(--emerald);
      color: #04130d;
    }

    /* Forms — 16px font prevents iOS Safari auto-zoom on focus */
    .field-group {
      margin-bottom: 10px;
      min-width: 0;
    }

    .field-label {
      display: block;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-secondary);
      margin-bottom: 5px;
    }

    .text-input, .select-input, .textarea-input {
      display: block;
      width: 100%;
      max-width: 100%;
      min-width: 0;
      background: var(--bg-input);
      border: 1px solid var(--border-subtle);
      border-radius: 12px;
      padding: 10px 12px;
      color: var(--text-primary);
      font-size: 16px;
      font-family: inherit;
      touch-action: manipulation;
    }

    input[type="date"].text-input {
      -webkit-appearance: none;
      appearance: none;
      display: flex;
      align-items: center;
      min-height: 44px;
      line-height: 1.2;
      text-align: left;
    }

    input[type="date"].text-input::-webkit-date-and-time-value {
      text-align: left;
      margin: 0;
    }

    .text-input:focus, .select-input:focus, .textarea-input:focus {
      outline: none;
      border-color: var(--emerald);
    }

    .grid-2 {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
      gap: 10px;
    }

    .pace-preview-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--bg-card-inner);
      border: 1px solid var(--border-subtle);
      border-radius: 12px;
      padding: 9px 12px;
      margin-bottom: 10px;
    }

    /* Coach Chat */
    .chat-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 12px;
      max-height: 360px;
      overflow-y: auto;
      padding-right: 2px;
    }

    .chat-bubble {
      border-radius: 14px;
      padding: 10px 12px;
      font-size: 13px;
      white-space: pre-wrap;
    }

    .chat-bubble.chad {
      background: var(--bg-card-inner);
      border: 1px solid var(--border-subtle);
      color: var(--text-primary);
    }

    .chat-bubble.user {
      background: var(--emerald-soft);
      border: 1px solid rgba(16, 185, 129, 0.35);
      color: #ecfdf5;
      margin-left: 24px;
    }

    /* Bottom Navigation — anchored solidly to viewport bottom */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      width: 100%;
      z-index: 40;
      background: #060911;
      border-top: 1px solid var(--border-subtle);
      padding: 6px 8px calc(8px + env(safe-area-inset-bottom));
      transform: translateZ(0);
      -webkit-transform: translateZ(0);
    }

    .bottom-nav-inner {
      max-width: 680px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 4px;
    }

    .nav-btn {
      background: transparent;
      border: none;
      border-radius: 12px;
      padding: 6px 2px;
      color: var(--text-muted);
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      touch-action: manipulation;
    }

    .nav-btn.active {
      background: var(--emerald-soft);
      color: var(--emerald);
    }

    /* Modal */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 50;
      background: rgba(2, 6, 23, 0.84);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 14px;
    }

    .modal-backdrop.open {
      display: flex;
    }

    function escapeHtml(str) {
      return String(str || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function getLocalIsoDate(dateObj = new Date()) {
      const y = dateObj.getFullYear();
      const m = String(dateObj.getMonth() + 1).padStart(2, '0');
      const d = String(dateObj.getDate()).padStart(2, '0');
      return `${y}-${m}-${d}`;
    }

    function getYesterdayIsoDate() {
      const d = new Date();
      d.setDate(d.getDate() - 1);
      return getLocalIsoDate(d);
    }

    function formatIsoDateLabel(isoDateStr) {
      if (!isoDateStr || !/^\d{4}-\d{2}-\d{2}$/.test(isoDateStr)) {
        return new Date().toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
      }
      const [y, m, d] = isoDateStr.split('-').map(Number);
      const dt = new Date(y, m - 1, d);
      return dt.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
    }

    function formatDateTimeStamp(isoDateStr) {
      const dateLabel = formatIsoDateLabel(isoDateStr || getLocalIsoDate());
      const timeLabel = new Date().toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });
      return `${dateLabel} • ${timeLabel}`;
    }

    function resolveItemIsoDate(item) {
      if (item && item.isoDate && /^\d{4}-\d{2}-\d{2}$/.test(item.isoDate)) {
        return item.isoDate;
      }
      if (item && typeof item.date === 'string') {
        const parsed = new Date(`${item.date}, ${new Date().getFullYear()}`);
        if (!Number.isNaN(parsed.getTime())) {
          return getLocalIsoDate(parsed);
        }
      }
      return '';
    }

    function getBaseDayById(dayId) {
      if (state.customDayTemplates && state.customDayTemplates[dayId]) {
        return state.customDayTemplates[dayId];
      }
      return PROGRAM_DAYS.find((d) => d.id === dayId) || PROGRAM_DAYS[0];
    }

    function getEffectiveDay(slotDayId) {
      const baseSlot = PROGRAM_DAYS.find((d) => d.id === slotDayId) || PROGRAM_DAYS[0];
      const swappedTemplateId = state.daySwaps && state.daySwaps[slotDayId];
      if (!swappedTemplateId || swappedTemplateId === slotDayId) {
        return {
          ...baseSlot,
          slotId: baseSlot.id,
          slotShortName: baseSlot.shortName,
          isDaySwapped: false
        };
      }
      const sourceTemplate = getBaseDayById(swappedTemplateId);
      return {
        ...sourceTemplate,
        id: baseSlot.id,
        slotId: baseSlot.id,
        shortName: baseSlot.shortName,
        slotShortName: baseSlot.shortName,
        isDaySwapped: true
      };
    }

    function getAllAvailableDayTemplates() {
      const customs = Object.values(state.customDayTemplates || {});
      return [...PROGRAM_DAYS, ...customs];

      return {
        selectedDayId: state.selectedDayId,

        supabaseUserKey: state.supabaseUserKey,
        geminiApiKey: state.geminiApiKey,
        coachMessages: state.coachMessages
      };
    }

    function applyParsedPayload(parsed) {
      if (!parsed || typeof parsed !== 'object') return;
      if (parsed.selectedDayId) state.selectedDayId = parsed.selectedDayId;
      if (parsed.daySwaps) state.daySwaps = parsed.daySwaps;
      if (parsed.customDayTemplates) state.customDayTemplates = parsed.customDayTemplates;
      if (parsed.swaps) state.swaps = parsed.swaps;
      if (parsed.customSwaps) state.customSwaps = parsed.customSwaps;
      if (parsed.targets) state.targets = parsed.targets;
      if (parsed.setsByDay) state.setsByDay = parsed.setsByDay;
      if (parsed.extraExercises) state.extraExercises = parsed.extraExercises;
      if (parsed.efforts) state.efforts = parsed.efforts;
      if (parsed.openCues) state.openCues = parsed.openCues;
      if (parsed.expandedHistory) state.expandedHistory = parsed.expandedHistory;
      if (parsed.notesByDay) state.notesByDay = parsed.notesByDay;
      if (parsed.calendarMonth) state.calendarMonth = parsed.calendarMonth;
      if (parsed.selectedCalendarDate !== undefined) state.selectedCalendarDate = parsed.selectedCalendarDate;
      if (Array.isArray(parsed.history)) state.history = parsed.history;
      if (Array.isArray(parsed.cardioLogs)) state.cardioLogs = parsed.cardioLogs;
      if (typeof parsed.stopwatchSeconds === 'number') state.stopwatchSeconds = parsed.stopwatchSeconds;
      if (typeof parsed.stopwatchRunning === 'boolean') state.stopwatchRunning = parsed.stopwatchRunning;
      if (parsed.stopwatchRunning && typeof parsed.lastTickTimestamp === 'number') {
        const elapsed = Math.max(0, Math.floor((Date.now() - parsed.lastTickTimestamp) / 1000));
        state.stopwatchSeconds += elapsed;
      }
      if (typeof parsed.supabaseUrl === 'string' && parsed.supabaseUrl) state.supabaseUrl = parsed.supabaseUrl;
      if (typeof parsed.supabaseAnonKey === 'string' && parsed.supabaseAnonKey) state.supabaseAnonKey = parsed.supabaseAnonKey;
      if (typeof parsed.supabaseUserKey === 'string' && parsed.supabaseUserKey) state.supabaseUserKey = parsed.supabaseUserKey;
      if (typeof parsed.geminiApiKey === 'string' && parsed.geminiApiKey) state.geminiApiKey = parsed.geminiApiKey;
      if (Array.isArray(parsed.coachMessages) && parsed.coachMessages.length > 0) {
        state.coachMessages = parsed.coachMessages;
      }
    }

    function updateSyncPillUI() {
      const pill = document.getElementById('syncStatusPill');
      const label = document.getElementById('syncStatusLabel');
      if (!pill || !label) return;
      pill.classList.remove('synced', 'error');
      if (!state.supabaseUrl || !state.supabaseAnonKey) {
        label.textContent = 'Local';
        return;
      }
      if (state.cloudSyncStatus === 'syncing') {
        pill.classList.add('synced');
        label.textContent = 'Syncing...';
      } else if (state.cloudSyncStatus === 'error') {
        pill.classList.add('error');
        label.textContent = 'Sync Err';
      } else {
        pill.classList.add('synced');
        label.textContent = 'Cloud';
      }
    }

    let cloudPushTimer = null;

    function scheduleCloudPush(immediate = false) {
      if (!state.supabaseUrl || !state.supabaseAnonKey) {
        updateSyncPillUI();
        return;
      }
      clearTimeout(cloudPushTimer);
      cloudPushTimer = setTimeout(() => {
        pushStateToSupabase(false);
      }, immediate ? 10 : 700);
    }

    async function pushStateToSupabase(showToast = false) {
      const baseUrl = String(state.supabaseUrl || '').trim().replace(/\/+$/, '');
      const anonKey = String(state.supabaseAnonKey || '').trim();
      const userKey = String(state.supabaseUserKey || 'default_athlete').trim() || 'default_athlete';
      if (!baseUrl || !anonKey) return false;

      state.cloudSyncStatus = 'syncing';
      updateSyncPillUI();

      try {
        const endpoint = `${baseUrl}/rest/v1/the_process_state?on_conflict=user_key`;
        const resp = await fetch(endpoint, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'apikey': anonKey,
            'Authorization': `Bearer ${anonKey}`,
            'Prefer': 'resolution=merge-duplicates,return=minimal'
          },
          body: JSON.stringify({
            user_key: userKey,
            payload: buildPersistPayload(),
            updated_at: new Date().toISOString()
          })
        });

        if (!resp.ok) {
          throw new Error(`HTTP ${resp.status}`);
        }
        state.cloudSyncStatus = 'synced';
        state.lastCloudUpdatedAt = new Date().toISOString();
        updateSyncPillUI();
        if (showToast) triggerToast('Synced to Supabase cloud!');
        return true;
      } catch (err) {
        state.cloudSyncStatus = 'error';
        updateSyncPillUI();
        if (showToast) triggerToast('Cloud sync failed — check Supabase URL & key');
        return false;
      }
    }

    async function pullStateFromSupabase(showToast = false) {
      const baseUrl = String(state.supabaseUrl || '').trim().replace(/\/+$/, '');
      const anonKey = String(state.supabaseAnonKey || '').trim();
      const userKey = String(state.supabaseUserKey || 'default_athlete').trim() || 'default_athlete';
      if (!baseUrl || !anonKey) return false;

      state.cloudSyncStatus = 'syncing';
      updateSyncPillUI();

      try {
        const endpoint = `${baseUrl}/rest/v1/the_process_state?user_key=eq.${encodeURIComponent(userKey)}&select=payload,updated_at`;
        const resp = await fetch(endpoint, {
          method: 'GET',
          headers: {
            'apikey': anonKey,
            'Authorization': `Bearer ${anonKey}`
          }
        });

        if (!resp.ok) {
          throw new Error(`HTTP ${resp.status}`);
        }
        const rows = await resp.json();
        if (Array.isArray(rows) && rows.length > 0 && rows[0].payload) {
          const remotePayload = rows[0].payload;
          const preservedUrl = state.supabaseUrl;
          const preservedKey = state.supabaseAnonKey;
          const preservedUser = state.supabaseUserKey;
          const preservedGemini = state.geminiApiKey;

          applyParsedPayload(remotePayload);

          if (!state.supabaseUrl) state.supabaseUrl = preservedUrl;
          if (!state.supabaseAnonKey) state.supabaseAnonKey = preservedKey;
          if (!state.supabaseUserKey) state.supabaseUserKey = preservedUser;
          if (!state.geminiApiKey && preservedGemini) state.geminiApiKey = preservedGemini;

          try {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(buildPersistPayload()));
          } catch (e) {}

          state.cloudSyncStatus = 'synced';
          state.lastCloudUpdatedAt = rows[0].updated_at || new Date().toISOString();
          updateSyncPillUI();
          updateTimerUI();
          switchTab(state.activeTab || 'workout');
          if (showToast) triggerToast('Restored workout history from Supabase!');
          return true;
        } else {
          state.cloudSyncStatus = 'synced';
          updateSyncPillUI();
          if (showToast) triggerToast('Connected! No remote backup found yet — pushing current data.');
          await pushStateToSupabase(false);
          return true;
        }
      } catch (err) {
        state.cloudSyncStatus = 'error';
        updateSyncPillUI();
        if (showToast) triggerToast('Could not connect to Supabase — verify URL & key');
        return false;
      }
    }

    function formatStopwatch(totalSec) {
      const safe = Math.max(0, Math.floor(Number(totalSec) || 0));
      const hrs = Math.floor(safe / 3600);
      const mins = Math.floor((safe % 3600) / 60);
      const secs = safe % 60;
      if (hrs > 0) {
        return `${hrs}:${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
      }
      return `${mins}:${String(secs).padStart(2, '0')}`;
    }

    function formatDurationMMSS(totalSec) {
      const safe = Math.max(0, Math.floor(Number(totalSec) || 0));
      const mins = Math.floor(safe / 60);
      const secs = safe % 60;
      return `${mins}:${String(secs).padStart(2, '0')}`;
    }

    function parseDurationToSeconds(rawVal) {
      const cleaned = String(rawVal || '').trim();
      if (!cleaned) return 0;
      if (cleaned.includes(':')) {
        const parts = cleaned.split(':');
        const mins = Math.max(0, parseInt(parts[0], 10) || 0);
        const secs = Math.max(0, Math.min(59, parseInt(parts[1], 10) || 0));
        return mins * 60 + secs;
      }
      const num = parseFloat(cleaned);
      if (Number.isNaN(num) || num <= 0) return 0;
      return Math.round(num * 60);
    }

      const activeName = getExerciseName(ex);

      const isCustomSwap = isSwapped && Array.isArray(state.customSwaps[ex.id]) && state.customSwaps[ex.id].includes(activeName);
      return {

    function getDayExercises(dayId) {
      const day = getEffectiveDay(dayId);
      const extras = state.extraExercises[dayId] || [];
      return [...day.exercises, ...extras];
    }

    function ensureDayInitialized(dayId) {
      const exercises = getDayExercises(dayId);
      if (!state.setsByDay[dayId]) state.setsByDay[dayId] = {};
      exercises.forEach((ex) => {
        if (!state.setsByDay[dayId][ex.id]) {
          const target = state.targets[ex.id];
          const baseWeight = target ? target.weight : ex.defaultWeight;
          const baseReps = target ? target.reps : ex.defaultReps;
          const rows = [];
          for (let i = 0; i < ex.defaultSets; i++) {
            rows.push({
              setNum: i + 1,
              weight: baseWeight,
              reps: baseReps,
              done: false
            });
          }
          state.setsByDay[dayId][ex.id] = rows;
        }
      });
    }

    function handleWeightChange(dayId, exId, setIndex, newWeightRaw) {
      ensureDayInitialized(dayId);
      const rows = state.setsByDay[dayId][exId];
      if (!rows || !rows[setIndex]) return;
      const parsedWeight = Math.max(0, parseFloat(newWeightRaw) || 0);
      for (let i = setIndex; i < rows.length; i++) {
        rows[i].weight = parsedWeight;
        const inputEl = document.getElementById(`w_${dayId}_${exId}_${i}`);
        if (inputEl && i > setIndex) {
          inputEl.value = parsedWeight;
        }
      }
      saveState();
    }

    function handleRepsChange(dayId, exId, setIndex, newRepsRaw) {
      ensureDayInitialized(dayId);
      const rows = state.setsByDay[dayId][exId];
      if (!rows || !rows[setIndex]) return;
      const parsedReps = Math.max(0, parseInt(newRepsRaw, 10) || 0);
      for (let i = setIndex; i < rows.length; i++) {
        rows[i].reps = parsedReps;
        const inputEl = document.getElementById(`r_${dayId}_${exId}_${i}`);
        if (inputEl && i > setIndex) {
          inputEl.value = parsedReps;
        }
      }
      saveState();
    }

    function deleteSetFromExercise(dayId, exId, setIndex) {
      ensureDayInitialized(dayId);
      const rows = state.setsByDay[dayId][exId] || [];

        triggerToast('Keep at least 1 set on the exercise.');
        return;

      openConfirmModal({
        title: 'Remove Set?',
        message: `Are you sure you want to delete Set ${setIndex + 1}?`,
        confirmLabel: 'Remove Set',
        onConfirm: () => {
          rows.splice(setIndex, 1);
          rows.forEach((r, idx) => {
            r.setNum = idx + 1;
          });
          state.setsByDay[dayId][exId] = rows;
          saveState();
          renderWorkoutTab();
          triggerToast('Set removed');
        }
      });

      rows[setIndex].done = !rows[setIndex].done;

      renderWorkoutTab();

      rows.push({

    function applyFullDaySwap(slotDayId, templateId) {
      state.daySwaps[slotDayId] = templateId;
      const exercises = getDayExercises(slotDayId);
      const rebuilt = {};
      exercises.forEach((ex) => {
        const target = state.targets[ex.id];
        const baseWeight = target ? target.weight : ex.defaultWeight;
        const baseReps = target ? target.reps : ex.defaultReps;
        const rows = [];
        for (let i = 0; i < ex.defaultSets; i++) {
          rows.push({
            setNum: i + 1,
            weight: baseWeight,
            reps: baseReps,
            done: false
          });
        }
        rebuilt[ex.id] = rows;
      });
      state.setsByDay[slotDayId] = rebuilt;

      closeModal();
      renderWorkoutTab();

      const rawExList = (exEl ? exEl.value : '')
        .split(',')
        .map((s) => s.trim())
        .filter(Boolean);

      const namesToUse = rawExList.length > 0
        ? rawExList
        : [

            `${rawTitle} Machine Press or Row`,
            `${rawTitle} Cable Isolation`,
            `${rawTitle} Dumbbell Movement`,
            `${rawTitle} Finisher`

        cue: 'Controlled tempo, full range of motion, clean finish.',
        swapBank: []
      };
      if (!state.extraExercises[dayId]) state.extraExercises[dayId] = [];
      state.extraExercises[dayId].push(newEx);
      ensureDayInitialized(dayId);
      saveState();
      closeModal();
      renderWorkoutTab();
      triggerToast(`Added ${name}`);
    }

    function completeWorkout() {
      const day = getEffectiveDay(state.selectedDayId);
      const exercises = getDayExercises(day.id);
      ensureDayInitialized(day.id);

      const completedEx = [];
      let totalSets = 0;
      let totalVolume = 0;

      exercises.forEach((ex) => {
        const rows = state.setsByDay[day.id][ex.id] || [];
        const doneRows = rows.filter((r) => r.done);
        if (doneRows.length > 0) {
          const exVol = doneRows.reduce((sum, r) => sum + (Number(r.weight) || 0) * (Number(r.reps) || 0), 0);
          const effort = state.efforts[ex.id] || 3;
          const swapInfo = getExerciseSwapInfo(ex);
          totalSets += doneRows.length;
          totalVolume += exVol;
          completedEx.push({
            id: ex.id,
            name: swapInfo.activeName,
            originalName: swapInfo.originalName,
            isSwapped: swapInfo.isSwapped,
            swapType: swapInfo.swapType,
            effort,
            volume: exVol,
            sets: doneRows.map((r) => ({ setNum: r.setNum, weight: r.weight, reps: r.reps }))
          });

          const topWeight = Math.max(...doneRows.map((r) => Number(r.weight) || 0));
          const minReps = Math.min(...doneRows.map((r) => Number(r.reps) || 0));
          if (topWeight > 0) {
            if (effort <= 2 && minReps >= ex.defaultReps) {
              const bump = topWeight >= 100 ? 5 : 2.5;
              state.targets[ex.id] = { weight: topWeight + bump, reps: ex.defaultReps };
            } else {
              state.targets[ex.id] = { weight: topWeight, reps: ex.defaultReps };
            }
          }
        }
      });

      if (completedEx.length === 0) {
        triggerToast('Check off at least one completed set before logging.');
        return;
      }

      const elapsedSec = state.stopwatchSeconds;
      const sessionNote = (state.notesByDay[day.id] || '').trim();
      const todayIso = getLocalIsoDate();

      state.history.unshift({
        id: `h_${Date.now()}`,
        isoDate: todayIso,
        date: formatIsoDateLabel(todayIso),
        completedAt: formatDateTimeStamp(todayIso),
        dayId: day.id,
        dayTitle: `${day.shortName}: ${day.title}`,
        isDaySwapped: Boolean(day.isDaySwapped),
        durationFormatted: formatStopwatch(elapsedSec),
        durationSeconds: elapsedSec,
        totalSets,
        totalVolume,
        sessionNote,
        exercises: completedEx
      });

      // Reset timer, checkmarks, notes, and effort ratings for a clean next session
      state.stopwatchRunning = false;
      state.stopwatchSeconds = 0;
      exercises.forEach((ex) => {
        delete state.efforts[ex.id];
      });
      delete state.setsByDay[day.id];
      delete state.notesByDay[day.id];
      ensureDayInitialized(day.id);

      saveState();
      updateTimerUI();
      renderWorkoutTab();
      triggerToast(`Logged ${day.title} (${formatStopwatch(elapsedSec)})`);
    }

    function computePaceDisplay(type, durationSeconds, distance, tempF) {
      if (type === 'Sauna') {
        return tempF ? `${tempF}°F Sauna` : 'Heat Recovery';
      }
      const dist = parseFloat(distance) || 0;
      if (!durationSeconds || dist <= 0) return '';
      const mins = durationSeconds / 60;
      if (type === 'Row Indoor') {
        const pace500Sec = durationSeconds / (dist / 0.5);
        return `${formatDurationMMSS(pace500Sec)} /500m`;
      }
      if (type === 'Stair Stepper') {
        return `${(dist / mins).toFixed(1)} flr/min`;
      }
      if (type === 'Biking') {
        return `${(dist / (durationSeconds / 3600)).toFixed(1)} mph`;
      }
      const paceSecPerMile = durationSeconds / dist;
      return `${formatDurationMMSS(paceSecPerMile)} /mi`;
    }

    function updateCardioPacePreview(prefix = 'cardio') {
      const typeEl = document.getElementById(`${prefix}Type`);
      const durEl = document.getElementById(`${prefix}Duration`);
      const distEl = document.getElementById(`${prefix}Distance`);
      const tempEl = document.getElementById(`${prefix === 'cardio' ? 'saunaTemp' : 'missedSaunaTemp'}`);
      const badgeEl = document.getElementById(`${prefix}PacePreview`);
      if (!typeEl || !badgeEl) return;

      const type = typeEl.value;
      const durSec = parseDurationToSeconds(durEl ? durEl.value : '');
      const dist = parseFloat(distEl ? distEl.value : '0') || 0;
      const temp = tempEl ? tempEl.value.trim() : '';

      if (type === 'Sauna') {
        badgeEl.textContent = temp ? `${temp}°F Sauna` : 'Heat Recovery';
        return;
      }

      const pace = computePaceDisplay(type, durSec, dist, temp);
      badgeEl.textContent = pace || 'Enter time & distance';
    }

    function handleCardioTypeChange() {
      const typeEl = document.getElementById('cardioType');
      const saunaRow = document.getElementById('saunaTempGroup');
      const distRow = document.getElementById('cardioDistanceGroup');
      if (!typeEl || !saunaRow || !distRow) return;
      const isSauna = typeEl.value === 'Sauna';
      saunaRow.style.display = isSauna ? 'block' : 'none';
      distRow.style.display = isSauna ? 'none' : 'block';
      updateCardioPacePreview('cardio');
    }

    function addCardioLog(event) {
      event.preventDefault();
      const type = document.getElementById('cardioType').value;
      const env = document.getElementById('cardioEnv').value;
      const dateInput = document.getElementById('cardioDate');
      const isoDate = (dateInput && dateInput.value) ? dateInput.value : getLocalIsoDate();
      const rawDuration = document.getElementById('cardioDuration').value;
      const durationSeconds = parseDurationToSeconds(rawDuration);
      const distance = parseFloat(document.getElementById('cardioDistance').value) || 0;
      const saunaTemp = document.getElementById('saunaTemp') ? document.getElementById('saunaTemp').value.trim() : '';
      const notes = document.getElementById('cardioNotes').value.trim();

      if (durationSeconds <= 0) {
        triggerToast('Enter duration like 9:33 or 25:00');
        return;
      }

      const unit = type === 'Row Indoor' ? 'm' : (type === 'Stair Stepper' ? 'floors' : 'mi');
      const durationFormatted = formatDurationMMSS(durationSeconds);
      const paceDisplay = computePaceDisplay(type, durationSeconds, distance, saunaTemp) || 'Logged';

      state.cardioLogs.unshift({
        id: `c_${Date.now()}`,
        isoDate,
        date: formatIsoDateLabel(isoDate),
        completedAt: formatDateTimeStamp(isoDate),
        type,
        environment: type === 'Sauna' ? 'Inside' : env,
        durationSeconds,
        durationFormatted,
        distance: type === 'Sauna' ? 0 : distance,
        unit,
        saunaTemp,
        paceDisplay,
        notes
      });

      saveState();
      renderCardioTab();
      triggerToast(`Logged ${type} (${durationFormatted})`);
    }

    function deleteCardioLog(cardioId) {
      const target = state.cardioLogs.find((c) => c.id === cardioId);
      openConfirmModal({
        title: 'Delete Cardio / Sauna Entry?',
        message: `Are you sure you want to delete this ${target ? target.type : 'session'} entry?`,
        confirmLabel: 'Delete Entry',
        onConfirm: () => {
          state.cardioLogs = state.cardioLogs.filter((c) => c.id !== cardioId);
          saveState();
          if (state.activeTab === 'progress') renderProgressTab();
          else renderCardioTab();
          triggerToast('Session removed');
        }
      });
    }

        const stampText = item.completedAt || item.date;
        return `
          <div class="card">
            <div class="card-header-row">

                <h3 class="card-title">${escapeHtml(item.type)}</h3>
                <p class="card-subtitle">${escapeHtml(stampText)} • ${escapeHtml(item.environment)} • ${escapeHtml(item.durationFormatted)}${item.distance > 0 ? ` • ${item.distance} ${escapeHtml(item.unit)}` : ''}</p>
              </div>
              <div style="display:flex;align-items:center;gap:6px;">

      const html = `
        <div class="card">
          <h2 class="card-title" style="margin-bottom:10px;">Log Cardio or Sauna</h2>

            <div class="grid-2">

                  <option value="Running">Running</option>
                  <option value="Treadmill Walk">Treadmill Walk</option>
                  <option value="Biking">Biking</option>
                  <option value="Row Indoor">Row Indoor</option>
                  <option value="Stair Stepper">Stair Stepper</option>
                  <option value="Sauna">Sauna</option>
                </select>
              </div>
              <div class="field-group">
                <label class="field-label" for="cardioEnv">Setting</label>
                <select id="cardioEnv" class="select-input">
                  <option value="Outside">Outside</option>
                  <option value="Inside">Inside</option>
                </select>
              </div>
            </div>

            <div class="field-group">
              <label class="field-label" for="cardioDate">Date</label>
              <input id="cardioDate" class="text-input" type="date" value="${todayIso}" />
            </div>

            <div class="grid-2">
              <div class="field-group">
                <label class="field-label" for="cardioDuration">Duration (MM:SS)</label>
                <input id="cardioDuration" class="text-input" type="text" placeholder="e.g. 9:33 or 25:00" oninput="updateCardioPacePreview('cardio')" required />
              </div>
              <div id="cardioDistanceGroup" class="field-group">
                <label class="field-label" for="cardioDistance">Distance (mi / m / floors)</label>
                <input id="cardioDistance" class="text-input" type="number" step="any" inputmode="decimal" placeholder="e.g. 1.5" oninput="updateCardioPacePreview('cardio')" />
              </div>

                <label class="field-label" for="saunaTemp">Sauna Temp (°F, optional)</label>
                <input id="saunaTemp" class="text-input" type="number" inputmode="numeric" placeholder="e.g. 185" oninput="updateCardioPacePreview('cardio')" />
              </div>
            </div>

            <div class="pace-preview-bar">

            <div class="field-group">

            <button type="submit" class="btn-primary btn-block">+ Save Session</button>
          </form>
        </div>

      document.getElementById('appMain').innerHTML = html;
